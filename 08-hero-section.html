<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>08 - Hero Section - Sebelum</title>
</head>
<body>
    <!-- 
    INSTRUKSI PENGERJAAN:
    1. Pada elemen <header>, atur height: 100vh agar memenuhi tinggi layar.
    2. Tambahkan background-image pada <header>. Agar gambar tidak belang, gunakan background-size: cover dan background-position: center.
    3. Agar teks mudah dibaca di atas gambar, tambahkan overlay linear-gradient pada property background-image (misal rgba hitam ke rgba hitam transparan).
    4. Gunakan Flexbox pada <header> (display: flex, flex-direction: column, justify-content: center, align-items: center) agar konten tepat di tengah.
    5. Ubah warna teks menjadi putih dan styling tombol (padding, background, border-radius).
    -->
    <!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>08 - Hero Section</title>

    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        /* Hero Section */
        header {
            height: 100vh;
            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.55),
                    rgba(0, 0, 0, 0.55)
                ),
                url("https://images.unsplash.com/photo-1556761175-b413da4baf72?auto=format&fit=crop&w=1600&q=80");

            background-size: cover;
            background-position: center;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;
            color: white;
            padding: 20px;
        }

        /* Isi Hero */
        .hero-content {
            max-width: 800px;
        }

        .hero-content h1 {
            font-size: 50px;
            margin-bottom: 20px;
        }

        .hero-content p {
            font-size: 20px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        /* Tombol */
        .btn {
            display: inline-block;
            padding: 14px 30px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover {
            background-color: #0056b3;
            transform: translateY(-3px);
        }

        /* Tampilan HP */
        @media (max-width: 600px) {
            .hero-content h1 {
                font-size: 35px;
            }

            .hero-content p {
                font-size: 16px;
            }

            .btn {
                padding: 12px 24px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="hero-content">

            <h1>Bangun Masa Depan Digital Anda</h1>

            <p>
                Kami membantu startup dan perusahaan bertransformasi
                menjadi lebih modern, inovatif, dan berkembang melalui
                teknologi digital.
            </p>

            <a href="#" class="btn">Mulai Proyek</a>

        </div>
    </header>

</body>
</html>
