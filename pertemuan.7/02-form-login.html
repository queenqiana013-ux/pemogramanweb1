<body>
    <!-- 
    INSTRUKSI PENGERJAAN (TO-DO LIST):
    1. Atur body agar form berada di tengah layar (Flexbox, min-height 100vh).
    2. Berikan gaya pada kontainer ".login-container" (background putih, padding 30px, border-radius 8px, box-shadow).
    3. Atur label agar display-nya 'block' dan memiliki margin-bottom agar input ada di bawahnya.
    4. Atur input text dan password agar lebarnya 100% (width: 100%), padding 10px, margin-bottom 15px, border 1px solid #ccc, dan border-radius 5px.
    5. Tambahkan pseudo-class :focus pada input (ubah warna border menjadi biru dan outline: none saat diklik).
    6. Atur tombol submit (lebar 100%, background warna, warna teks putih, padding, border-radius, cursor: pointer, border: none).
    7. Tambahkan efek hover pada tombol submit.
    -->
    <!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>02 - Form Login</title>

    <style>
        /* Reset dasar */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body */
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        /* Container Login */
        .login-container {
            width: 350px;
            background-color: white;

            padding: 30px;

            border-radius: 10px;

            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        /* Judul */
        .login-container h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        /* Label */
        .login-container label {
            display: block;
            margin-bottom: 8px;
            color: #333;
        }

        /* Input */
        .login-container input[type="text"],
        .login-container input[type="password"] {
            width: 100%;
            padding: 10px;

            margin-bottom: 15px;

            border: 1px solid #ccc;
            border-radius: 5px;

            outline: none;
        }

        /* Focus Input */
        .login-container input[type="text"]:focus,
        .login-container input[type="password"]:focus {
            border-color: blue;
            outline: 2px solid rgba(0, 0, 255, 0.2);
        }

        /* Tombol Submit */
        .login-container input[type="submit"] {
            width: 100%;

            padding: 10px;

            background-color: #007bff;
            color: white;

            border: none;
            border-radius: 5px;

            cursor: pointer;
        }

        /* Hover Tombol */
        .login-container input[type="submit"]:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <h2>Masuk ke Akun</h2>
        <form>

            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Masukkan username"
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Masukkan password"
            >

            <input
                type="submit"
                value="Login"
            >

        </form>

    </div>

>
    
</body>
</html>
